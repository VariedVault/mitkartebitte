<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>mit Karte, bitte - Learn German A1→B1</title>
<meta name="description" content="A card-table-themed German grammar course, A1 to B1. Spaced-repetition flashcards, 16 fully worked modules, no accounts, works offline.">
<meta name="theme-color" content="#0a2827">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="css/fonts.css">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<div class="app-shell">
  <header class="app-header" id="appHeader">
    <button class="wordmark" id="wordmarkBtn" aria-label="Go to course map">
      <span class="card-glyph" aria-hidden="true"></span>
      mit <span class="bump">Karte</span>, bitte
    </button>
    <span class="breadcrumb" id="breadcrumb"></span>
    <button class="profile-pill" id="profilePill" aria-label="Switch profile" hidden></button>
  </header>

  <main class="view" id="view" role="main"></main>

  <footer class="app-footer" id="appFooter">
    <div class="footer-inner">
      <div class="footer-grid">
        <div class="footer-col">
          <h3 class="footer-heading">Navigation</h3>
          <a href="#/course-map">Map</a>
          <a href="#/practice">Practice</a>
          <a href="#/data">Settings</a>
        </div>
        <div class="footer-col">
          <h3 class="footer-heading">About</h3>
          <p class="footer-about">A free, open-source tool to learn German A1→B1. No signup, no ads, no tracking. Works offline.</p>
          <a href="https://github.com/VariedVault" target="_blank" rel="noopener noreferrer">Part of VariedVault</a>
        </div>
        <div class="footer-col">
          <h3 class="footer-heading">Legal</h3>
          <a href="#/impressum">Impressum</a>
          <a href="#/datenschutz">Datenschutz</a>
          <a href="#/contact">Contact</a>
        </div>
      </div>
      <div class="footer-bottombar">
        <span>Built by <a href="https://github.com/VariedVault" target="_blank" rel="noopener noreferrer">Balaji</a></span>
        <a href="https://buymeacoffee.com/variedvault" target="_blank" rel="noopener noreferrer" class="coffee-link">☕ Buy me a coffee</a>
      </div>
    </div>
  </footer>

  <nav class="bottom-nav" id="bottomNav" aria-label="Primary">
    <button data-nav="map" data-path="" aria-label="Course map">
      <span class="icon" aria-hidden="true">🗺️</span>Map
    </button>
    <button data-nav="practice" data-path="/practice" aria-label="Practice deck">
      <span class="icon" aria-hidden="true">🃏</span>Practice
    </button>
    <button data-nav="settings" data-path="/data" aria-label="Backup and settings">
      <span class="icon" aria-hidden="true">⚙️</span>Settings
    </button>
  </nav>
</div>

<script type="module" src="js/app.js"></script>
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
  }
</script>
  <script data-goatcounter="https://mitkarte-bitte.goatcounter.com/count"
        async src="//gc.zgo.at/count.js"></script>
</body>
</html>
